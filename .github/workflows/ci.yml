name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q

  quality:
    name: Lint, format, types, MAID
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      # Source files covered by active MAID manifests, plus tests.
      # tests/test_ci_workflow.py fails if a covered file is missing here.
      MAID_COVERED_PATHS: >-
        src/mcp_server_everything_search/platform_search.py
        src/mcp_server_everything_search/server.py
        tests
      MAID_RUNNER_SPEC: maid-runner[all]==2.28.0
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --locked
      - run: uv run ruff check $MAID_COVERED_PATHS
      - run: uv run ruff format --check $MAID_COVERED_PATHS
      - run: uv run pyright $MAID_COVERED_PATHS
      - run: scripts/maid validate
