repos:
# BEGIN MAID RUNNER PRE-COMMIT
  - repo: local
    hooks:
      - id: maid-verify
        name: MAID verification (fail-fast handoff gates)
        entry: scripts/maid verify --profile pre-commit --since HEAD
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
# END MAID RUNNER PRE-COMMIT
