schema: '2'
sequence_number: 2
goal: Port the MCP server to the mcp 2.x lowlevel Server API so fresh installs start again
type: fix
created: '2026-10-17T01:52:41Z'
metadata:
  tags:
  - mcp
  - dependency
  - brownfield-coverage
description: |
  mcp 2.0 (released 2026-08) replaced the lowlevel Server decorators
  (@server.list_tools, @server.call_tool, @server.list_resources, ...) with
  constructor on_* handlers taking (ctx, params) and returning full result
  types. pyproject required an unbounded mcp>=1.0.0, so every fresh uvx install
  of v0.2.1 resolves mcp 2.3.0 and crashes at startup with
  AttributeError: 'Server' object has no attribute 'list_resources'
  (reproduced in a Windows 11 VM on 2026-10-17).

  Decision: port to mcp 2.x and require mcp>=2.0.0,<3 instead of capping at
  mcp<2. The 1.x API is the past; the upper bound on the next major prevents a
  repeat of this outage. The lowlevel Server is kept (not MCPServer) because the
  tool schema is hand-built per platform by UnifiedSearchQuery.

  Restructure server.py for testability: the handlers were closures inside
  serve(). Extract pure functions build_search_tool, parse_search_arguments and
  format_results, and a create_server(search_provider, system) composition
  function that wires on_list_tools, on_call_tool, on_list_resources,
  on_list_resource_templates and on_list_prompts. serve() stays the composition
  root (real provider + stdio). Tests drive create_server through the in-memory
  mcp.Client with a fake SearchProvider.

  Behavior is preserved except where mcp 2.x semantics require a choice:
  - Search failures (provider errors, invalid arguments) keep the
    "Search failed: <message>" text but now return CallToolResult with
    is_error=True so clients and models can tell a failure from results.
  - Unknown tool names raise MCPError(-32602) (spec invalid-params); a plain
    ValueError would reach the client as a sanitized -32603.
  - params.arguments may be None in 2.x; it is treated as {}.
  mcp 2.x no longer validates arguments against input_schema, so
  parse_search_arguments (Pydantic) remains the validation boundary.
  Characterized as-is (not fixed here): mac_params/linux_params are ignored when
  parsing (#30, PR #32).

  The system argument of build_search_tool/create_server selects the platform
  description and the provider call path. The tool input schema and the
  description's first line still follow platform.system() through
  UnifiedSearchQuery.get_schema_for_platform() and the existing template;
  serve() passes platform.system().lower(), so in production they agree.

  Out of scope: the version bump and PyPI release (separate release step);
  stdin UTF-8 handling (#27/#28).

  The unused SearchQuery model is removed; nothing imports it.
temptations:
- risk: Testing handlers by calling private closures or mocking Server internals.
  instead: Drive create_server through mcp.Client in-memory with FakeSearchProvider and assert on protocol results.
- risk: 'Silently fixing #30 (mac/linux params), rewording result text, or trimming the platform syntax guides while porting.'
  instead: 'Move parse, format and description logic verbatim; characterization tests pin result text, guide lines and #30 behavior.'
- risk: Catching every exception and returning text without is_error, hiding failures.
  instead: Return CallToolResult(is_error=True) for search failures; raise MCPError(-32602) for unknown tools.
- risk: serve() passes tests while calling a removed API, skipping create_server, or wiring the wrong provider.
  instead: Keep serve() as the composition root and exercise it through the stdio_server and get_provider seams.
- risk: Ignoring the system argument and reading platform.system() inside create_server.
  instead: Branch on the system argument; test_server_search_path_follows_system_argument pins it.
