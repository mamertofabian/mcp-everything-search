schema: '2'
sequence_number: 11
goal: Publish the server to the official MCP Registry as io.github.mamertofabian/mcp-everything-search
type: feature
created: '2026-10-17T05:14:30Z'
metadata:
  tags:
  - release
  - registry
description: 'The official modelcontextprotocol/servers README no longer lists community

  servers and points to the MCP Registry, where this server is not published.

  PulseMCP shows a placeholder mirror "until the maintainer publishes it", and

  Glama/mcp.directory import from the registry.


  Add server.json (template from mcp-publisher 1.8.1 init, schema 2025-12-11):

  name io.github.mamertofabian/mcp-everything-search, PyPI package

  mcp-server-everything-search over stdio, and the two environment variables

  the server reads (EVERYTHING_SDK_PATH, Windows only; EVERYTHING_SEARCH_TOOL_NAME,

  default "search"). Both are isRequired: false because the registry entry is

  cross-platform; the SDK path is required on Windows and documented as such.


  The registry verifies PyPI ownership by finding `mcp-name: <name>` in the

  package description (README), so the README gains a hidden HTML comment and the

  release is bumped to 0.3.2 (PyPI descriptions are fixed per version).


  Tests keep server.json in sync with the installed package (name/README marker,

  both versions, identifier, transport, environment variables, description length

  <= 100 per the schema). Publishing (mcp-publisher login/publish) and tagging

  are separate, user-approved steps.


  Release order (separate, user-approved): tag and publish 0.3.2 to PyPI, confirm

  the PyPI description contains the marker, then `mcp-publisher login github`

  and `mcp-publisher publish`. Publishing before 0.3.2 is live fails ownership

  verification because 0.3.1''s description has no marker.'
temptations:
- risk: Hard-coding version strings in server.json tests.
  instead: Compare server.json versions with importlib.metadata.version().
- risk: Marking EVERYTHING_SDK_PATH as required, which blocks macOS/Linux installs in registry clients.
  instead: Mark it optional and say 'required on Windows' in its description.
