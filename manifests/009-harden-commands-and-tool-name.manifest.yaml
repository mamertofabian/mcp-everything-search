description: |-
  Supersedes 007 (pushed) because it changes behavior 007's locked tests pin
  (exact locate command lines, mac search_directory values, Windows provider
  construction). Re-declares the full server.py and search_interface.py
  contracts; 008's PartialResults remains declared by 008 (chain merge).

  Provider hardening, borrowed from amcaude `devin/1787761095-security-fixes`
  (afd1b13), without its obsolete dependency bumps:
  - run_command has a timeout (30 s default) and raises RuntimeError when a
    command hangs, so a stuck mdfind/locate cannot hang the server.
  - locate: the query follows "--" (verified with plocate 1.1.15), so a query
    such as "--database=..." is searched instead of parsed as an option.
  - mdfind: a literal/interpreted (raw) query must not start with "-" (it would
    be parsed as an option, e.g. -live never exits); the default -name mode
    passes the query as the value of -name, so it is unaffected.
  - mdfind search_directory is expanded (~) and must exist; previously a typo
    silently returned no results.
  - Windows: the provider no longer falls back to the original author's
    D:\dev\... DLL path. get_provider (the composition root) passes
    EVERYTHING_SDK_PATH; unset or non-file paths raise a RuntimeError that
    names the variable.

  Configurable tool name (from kshin5 7e5aef3, #19): the tool stays "search" by
  default; EVERYTHING_SEARCH_TOOL_NAME renames it (e.g. "everything_search") for
  clients where a generic name collides with another server's tool. The name
  must match ^[A-Za-z0-9_-]{1,64}$, the strictest common client limit; an
  invalid value fails at startup (main exits 1). serve() reads the variable via
  resolve_tool_name; create_server/build_search_tool take tool_name. Unknown
  names, including "search" after a rename, raise MCPError(-32602).

  008 dependency kept: WindowsSearchProvider.search_files still passes SDK
  results through unchanged, so PartialResults reaches format_results
  (008's end-to-end test).

  tests/test_server.py is also hashed by 003's lock as a regression file; that
  lock is refreshed with --preserve-red-evidence after promotion, as for 007.

  Unverified: mdfind treating "-draft" as the value of -name (default mode) is
  assumed from getopt semantics; there is no macOS host to check it. Docs
  (README, CLAUDE.md, which still describes the removed D:\dev default) are
  updated in a separate docs-only commit per the maintainer's no-MAID-for-docs
  policy, so they are not in this manifest's scope.
temptations:
- risk: Rejecting every query that starts with '-' on all platforms.
  instead: Use '--' for locate, reject only raw mdfind queries, and leave -name values and Everything queries alone.
- risk: Renaming the tool by default, breaking existing client configs.
  instead: Keep 'search' as default; rename only via EVERYTHING_SEARCH_TOOL_NAME.
- risk: Reading environment variables inside providers or create_server.
  instead: Read them at composition roots (get_provider, serve) and pass values in.
- risk: Silently ignoring an invalid tool name or missing SDK path.
  instead: Raise errors that name the variable; main exits 1.
- risk: Changing WindowsSearchProvider.search_files to transform SDK results, dropping 008's PartialResults warning.
  instead: Keep the passthrough; 008's end-to-end test guards it.
