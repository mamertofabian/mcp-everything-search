# manifest-kind: implementation
# MAID manifest - a machine-checked contract for one change.
# Declares the intent, the files it may touch, and the commands that verify it.
# Nothing here is needed to build or run this project; safe to ignore.
# What it is: https://github.com/mamertofabian/maid-runner
schema: '2'
sequence_number: 12
goal: Start the server on Linux without locate/plocate and report the missing tool at search time
type: fix
created: '2026-10-17T06:08:58Z'
supersedes:
- 009-harden-commands-and-tool-name
metadata:
  tags:
  - linux
  - startup
  - directories
description: |-
  Supersedes 009 (pushed) because 009's locked test pinned that
  LinuxSearchProvider() raises when neither plocate nor locate is installed.
  Re-declares 009's full server.py and search_interface.py contracts; only the
  Linux provider's construction behavior and the locate_cmd/locate_type types
  (Optional[str]) change. 008's PartialResults stays with 008.

  Why: the server exited at startup in bare Linux containers, so Glama's
  automatic build tests (inferMcpServerBuildSpecJob, which ignores the saved
  spec) and any inspector that runs it with defaults could not list its tools.
  Now the provider constructs with locate_cmd None, the server starts and lists
  `search`, and search/count raise the same installation-instructions
  RuntimeError, which the server returns as an error result (fail loud at use).

  tests/test_server.py is taken over unchanged (it is hashed by 003's lock);
  the server-level behavior is tested in the new tests/test_linux_without_locate.py
  to avoid lock cascades.

  Release 0.3.3 metadata (pyproject, uv.lock, server.json, CHANGELOG) is in
  scope; 011's registry tests and 006's release tests validate it. Tagging and
  `mcp-publisher publish` remain separate user-approved steps.
temptations:
- risk: Silently returning no results when locate is missing.
  instead: Raise the installation-instructions RuntimeError at search time; the server returns it with is_error.
- risk: Editing tests/test_server.py and cascading lock tampering into 003.
  instead: Put the server-level test in a new file; take over test_server.py unchanged.
