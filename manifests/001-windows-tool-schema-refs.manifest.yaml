  - '#21'
  - '#26'
description: |
  UnifiedSearchQuery.get_schema_for_platform() embeds each sub-model's
  model_json_schema() under properties.<platform>_params. Pydantic renders
  WindowsSpecificParams.sort_by as {"$ref": "#/$defs/WindowsSortOption"} with
  its $defs nested inside windows_params, but "#/..." pointers resolve from the
  document root, so the pointer dangles. jsonschema/referencing raises
  PointerToNowhere (Cherry Studio, DeepSeek HTTP 400) and Gemini CLI skips the
  tool because sort_by has no "type" (#21). macOS and Linux schemas contain no
  $ref today and are characterized, not changed.

  Decision: inline every local "#/$defs/<Name>" reference in each sub-schema
  and drop the nested $defs, so the returned schema contains no $ref and every
  property carries its own "type". Chosen over PR #37 (hoist $defs to the root)
  because hoisting leaves sort_by without a "type", which still breaks Gemini
  CLI (#21) and other clients with limited $ref support. Chosen over PR #29
  (replace the WindowsSortOption enum with a Literal) because it preserves the
  public WindowsSortOption enum and works for any future nested model or enum.
  The ref-inlining helper is private to platform_search.py. When inlining, the
  referencing property's own keys (description, default) take precedence over
  the referenced definition's keys; the definition's title is dropped.
  get_schema_for_platform is a @classmethod called on the class (server.py);
  MAID has no classmethod marker, so it is declared as a method with args: [].

  Brownfield coverage: platform_search.py had no manifest or tests. Every
  public artifact is declared and characterized. The platform is read from
  platform.system(); tests stub it so all three platforms run on any host
  instead of changing public signatures in this fix.

  pyproject.toml/uv.lock: add jsonschema as a dev dependency (the same
  validator family that produced the reported error) and move the deprecated
  [tool.uv] dev-dependencies list to [dependency-groups] dev, because uv emits
  a deprecation warning on every command.
temptations:
- risk: Testing only the host platform passes on Linux CI without the fix (PR #37's tests do this).
  instead: Stub platform.system() and assert Windows schema behavior on every host.
- risk: Removing $ref by dropping sort_by, its enum, or other fields would pass a refs-only check.
  instead: Validate real requests with jsonschema and assert sort_by keeps type integer, the full enum, and default 1.
- risk: Fixing only sort_by by hand-writing its schema leaves the bug for the next enum or nested model.
  instead: Inline local $refs generically for every sub-schema returned by get_schema_for_platform.
- risk: Changing WindowsSortOption to a Literal or str enum breaks server.py and SDK sort codes.
  instead: Keep WindowsSortOption as an int Enum with the existing members and values.
