description: |-
  Adapts PR #32 (WhizZest) onto the mcp 2.x code so macOS and Linux platform
  parameters take effect: macOS search_directory scoping (#25) and the Linux
  locate options (#30). Supersedes 002 because 002's locked test pinned the old
  behavior that mac_params/linux_params are ignored; this manifest re-declares
  the full server.py contract unchanged and takes over tests/test_server.py and
  tests/test_package_metadata.py, with that one test replaced.

  Decisions (differences from PR #32, stated in the PR thread):
  - macOS keeps the existing `-name` filename search as the default and adds
    `-onlyin DIR`. literal_query / interpret_query pass the raw query with
    `-literal` / `-interpret`, since those flags only make sense for query
    strings. PR #32 passed every query raw (a behavior change) and added
    `-limit`, which is not an mdfind option; results are sliced to max_results
    instead.
  - live_updates raises ValueError: `mdfind -live` never exits, so it would hang
    the server. The schema field is left in place (platform_search.py is out of
    scope) and the error explains why.
  - Linux maps ignore_case->-i, regex_search->-r (plocate) / --regex (mlocate),
    existing_files->-e, and adds `-l max_results`; flags verified against
    plocate 1.1.15 (-l/--limit, -c/--count, -e/--existing in man page).
    With no linux_params the schema defaults now apply (ignore_case and
    existing_files true), so `-e` is added by default.
  - count_only uses a separate count_files() path returning "Total matches: N"
    instead of PR #32's SearchResponse refactor, which also changed
    everything_sdk.py (no coverage) and added unrelated statistics.
  - Brownfield coverage: search_interface.py gets full behavioral tests. Commands
    run through an injected command runner and the Windows provider accepts an
    injected Everything SDK, so tests run no subprocesses and load no DLL. Its
    pre-existing ruff/pyright errors are fixed, and it is added to the CI
    MAID_COVERED_PATHS (enforced by tests/test_ci_workflow.py).
  - macOS behavior cannot be run here (no mac); it is covered by command-shape
    tests only. Linux flags were checked against the real plocate.

  Credit: commit carries Co-authored-by WhizZest.

  Contract notes: SearchProvider.search_files stays an @abc.abstractmethod with
  the narrowed (query, max_results=100) signature; platform options are
  keyword arguments on each provider. macOS argument order is
  `mdfind [-onlyin DIR] [-literal] [-interpret] QUERY`, with `-name` only when
  neither literal nor interpret is set. The Windows provider depends on the
  EverythingBackend Protocol rather than the concrete EverythingSDK. EverythingBackend.search_files takes sort_by: int to match the real
  EverythingSDK; WindowsSearchProvider maps sort_by=None to 1.
  The server passes platform options to providers as a dict unpack
  (WindowsSpecificParams/MacSpecificParams/LinuxSpecificParams.model_dump()),
  so the abstract base keeps the narrow signature and pyright accepts every override.
temptations:
- risk: 'Merging PR #32 wholesale, including mdfind -limit, the SearchResponse refactor and everything_sdk.py edits.'
  instead: Port only the platform-parameter behavior; keep List[SearchResult] and leave everything_sdk.py untouched.
- risk: Supporting live_updates by running mdfind -live, which blocks forever.
  instead: Raise ValueError before running any command; the server reports it as an error result.
- risk: Testing providers by running real mdfind/locate or loading the DLL.
  instead: Inject FakeRunner / FakeEverythingSDK through the constructors.
- risk: Changing the macOS default from filename search to raw Spotlight queries.
  instead: Keep -name as default; only literal_query/interpret_query switch to the raw query.
