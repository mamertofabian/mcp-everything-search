description: |-
  Make the Windows Everything SDK wrapper robust and loud about missing data,
  borrowing from forks: amcaude `devin/1787761236-error-handling` (584b526),
  WhizZest 7500f8a, with the same idea in s-github-2 a1d703e and gjy1992 4b62e8e.
  Fixes #14 (one bad attribute dropped the whole result).

  Behavior:
  - Each timestamp is converted separately; an unrepresentable one becomes None
    with a logged warning instead of dropping the result.
  - A result that cannot be read is skipped and counted. If some results are
    unreadable the SDK returns PartialResults (a list subclass with an
    `unreadable` count) and format_results appends a visible warning line, so the
    model and user can tell results are missing (fail-loud; amcaude only logged).
    If every result is unreadable, a RuntimeError is raised instead of an empty list.
  - Query failure raises EverythingError when the SDK reports a code, otherwise
    RuntimeError. Everything_Reset runs in a finally block.
  - DLL load errors are RuntimeErrors naming EVERYTHING_SDK_PATH; a DLL without
    the SDK functions is rejected; off Windows the default loader reports that
    the SDK is Windows-only.
  - print-to-stderr debug lines are replaced by the module logger.

  Brownfield coverage: everything_sdk.py had no manifest/tests. All public
  artifacts, including the SDK constants, are declared; a characterization test
  pins every constant to the Everything SDK header values. A loader parameter
  lets tests inject a fake DLL, so the wrapper is tested on any OS. The file is
  added to CI MAID_COVERED_PATHS; its pre-existing ruff/pyright errors are fixed.

  PartialResults is added to search_interface.py (chain merge with 007; additive).
  server.py is in scope only for the format_results warning line (no signature
  change). Test files owned by 007 are not in this manifest's validate list so a
  later supersede of 007 does not cascade lock tampering into 008.

  Out of scope: the 260-character path buffer (long paths are truncated).

  Residual risk: ctypes argtypes/restype against the real Everything64.dll cannot
  be proven by the fake; that code is only reformatted. On CI's windows-latest
  runner a win32-only test exercises the real ctypes.WinDLL loader and its
  OSError translation. The end-to-end warning test relies on
  WindowsSearchProvider.search_files passing SDK results through unchanged.
temptations:
- risk: Catching every per-result exception and silently returning fewer results.
  instead: Count unreadable results, return PartialResults, and surface a warning line in the tool output.
- risk: Testing the wrapper only on Windows or by mocking ctypes internals.
  instead: Inject FakeEverythingDLL through the loader parameter and assert on returned results and recorded calls.
- risk: Changing timestamp output format or SearchResult fields while refactoring.
  instead: Keep ISO strings and existing fields; tests pin field values.
