description: |
  The darwin, linux and windows syntax guide strings in server.py contain
  literal backslashes ("\.", "C:\Projects"). As non-raw strings these are
  invalid escape sequences: SyntaxWarning on Python 3.12+ and pyright
  reportInvalidStringEscapeSequence warnings. PR #11 (pangu / beibeiyhj)
  made the three guides raw strings; that branch no longer applies after the
  mcp 2.x port moved the strings to module level, so the same change is
  re-applied here with the PR author credited as co-author.

  The string values must not change: raw strings are value-identical only
  because the guides contain no valid escape sequences. The characterization
  test pins the literal backslashes in the rendered tool description.
temptations:
- risk: "Silencing the warning with a warnings filter or by deleting the backslash examples from the guides."
  instead: "Prefix the three guide literals with r and keep every character of the text."
